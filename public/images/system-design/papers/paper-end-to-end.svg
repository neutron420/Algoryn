<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-paper-end-to-end" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Sheet Background -->
  <rect width="600" height="400" fill="url(#bg-paper-end-to-end)"/>
  <rect x="12" y="12" width="576" height="376" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Conference Banner -->
  <rect x="12" y="12" width="576" height="44" rx="8" fill="#0f172a"/>
  <rect x="12" y="52" width="576" height="4" fill="#64748b"/>
  
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.2">ACM TOCS &apos;84</text>
  <text x="568" y="38" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8">1984 • RESEARCH PAPER</text>

  <!-- Subtitle -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" font-style="italic">ACM Transactions on Computer Systems</text>

  <!-- Title (split into 2 readable lines) -->
  <text x="32" y="115" font-family="Georgia, Cambria, serif" font-size="20" font-weight="bold" fill="#0f172a">
    End-to-End Arguments in System Design
  </text>
  

  <!-- Authors & Affiliation -->
  <text x="32" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Jerome H. Saltzer, David P. Reed, and David D. Clark</text>
  <text x="32" y="166" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">M.I.T. Laboratory for Computer Science</text>

  <!-- Divider -->
  <line x1="32" y1="184" x2="568" y2="184" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Abstract Box -->
  <rect x="32" y="198" width="536" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="198" width="5" height="110" rx="2" fill="#64748b"/>
  <text x="48" y="220" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#0f172a" letter-spacing="1">ABSTRACT &amp; BREAKTHROUGH</text>

  <text x="48" y="244" font-family="Georgia, serif" font-size="12" fill="#334155">
    Functions placed at low levels of a system may be redundant or of little va
  </text>
  <text x="48" y="264" font-family="Georgia, serif" font-size="12" fill="#334155">
    lue compared with the cost of providing them at that low level.
  </text>
  <text x="48" y="284" font-family="Georgia, serif" font-size="12" fill="#334155">
    ...
  </text>

  <!-- Formula Badge -->
  <rect x="380" y="210" width="176" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="468" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#64748b">SYSTEM MODULARITY</text>
  <text x="468" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" font-style="italic" fill="#0f172a">Correctness at Endpoints</text>

  <!-- Footer -->
  <text x="32" y="370" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Algoryn Verified System Design Archive • ACM TOCS &apos;84</text>
  <text x="568" y="370" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">Verified Peer-Reviewed</text>
</svg>