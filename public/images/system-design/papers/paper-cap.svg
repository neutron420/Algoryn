<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-paper-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Sheet Background -->
  <rect width="600" height="400" fill="url(#bg-paper-cap)"/>
  <rect x="12" y="12" width="576" height="376" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Conference Banner -->
  <rect x="12" y="12" width="576" height="44" rx="8" fill="#0f172a"/>
  <rect x="12" y="52" width="576" height="4" fill="#06b6d4"/>
  
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.2">ACM SIGACT &apos;02</text>
  <text x="568" y="38" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8">2002 • RESEARCH PAPER</text>

  <!-- Subtitle -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" font-style="italic">ACM SIGACT News Distributed Computing Column</text>

  <!-- Title (split into 2 readable lines) -->
  <text x="32" y="115" font-family="Georgia, Cambria, serif" font-size="20" font-weight="bold" fill="#0f172a">
    Brewer&apos;s Conjecture and the Feasibility of...
  </text>
  <text x="32" y="140" font-family="Georgia, Cambria, serif" font-size="17" font-weight="bold" fill="#334155"> Consistent, Available, Partition-Tolerant Web Services</text>

  <!-- Authors & Affiliation -->
  <text x="32" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Seth Gilbert and Nancy Lynch</text>
  <text x="32" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Massachusetts Institute of Technology (MIT CSAIL)</text>

  <!-- Divider -->
  <line x1="32" y1="208" x2="568" y2="208" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Abstract Box -->
  <rect x="32" y="220" width="536" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="220" width="5" height="110" rx="2" fill="#06b6d4"/>
  <text x="48" y="242" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#0f172a" letter-spacing="1">ABSTRACT &amp; BREAKTHROUGH</text>

  <text x="48" y="266" font-family="Georgia, serif" font-size="12" fill="#334155">
    We prove that it is impossible in an asynchronous network model for a distr
  </text>
  <text x="48" y="286" font-family="Georgia, serif" font-size="12" fill="#334155">
    ibuted system to simultaneously guarantee consistency, availability, and pa
  </text>
  <text x="48" y="306" font-family="Georgia, serif" font-size="12" fill="#334155">
    rtition tolerance....
  </text>

  <!-- Formula Badge -->
  <rect x="380" y="232" width="176" height="36" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="468" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#64748b">CAP TRILEMMA</text>
  <text x="468" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" font-style="italic" fill="#0f172a">Consistency • Availability • Partition</text>

  <!-- Footer -->
  <text x="32" y="370" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Algoryn Verified System Design Archive • ACM SIGACT &apos;02</text>
  <text x="568" y="370" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">Verified Peer-Reviewed</text>
</svg>