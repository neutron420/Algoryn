<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-paper-bigtable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Sheet Background -->
  <rect width="600" height="400" fill="url(#bg-paper-bigtable)"/>
  <rect x="12" y="12" width="576" height="376" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Conference Banner -->
  <rect x="12" y="12" width="576" height="44" rx="8" fill="#0f172a"/>
  <rect x="12" y="52" width="576" height="4" fill="#3b82f6"/>
  
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.2">OSDI &apos;06</text>
  <text x="568" y="38" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8">2006 • RESEARCH PAPER</text>

  <!-- Subtitle -->
  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" font-style="italic">USENIX Symposium on Operating Systems Design &amp; Implementation</text>

  <!-- Title (split into 2 readable lines) -->
  <text x="32" y="115" font-family="Georgia, Cambria, serif" font-size="20" font-weight="bold" fill="#0f172a">
    Bigtable: A Distributed Storage System for...
  </text>
  <text x="32" y="140" font-family="Georgia, Cambria, serif" font-size="17" font-weight="bold" fill="#334155"> Structured Data</text>

  <!-- Authors & Affiliation -->
  <text x="32" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Fay Chang, Jeffrey Dean, Sanjay Ghemawat, et al.</text>
  <text x="32" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Google, Inc., Mountain View, CA</text>

  <!-- Divider -->
  <line x1="32" y1="208" x2="568" y2="208" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Abstract Box -->
  <rect x="32" y="220" width="536" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="220" width="5" height="110" rx="2" fill="#3b82f6"/>
  <text x="48" y="242" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#0f172a" letter-spacing="1">ABSTRACT &amp; BREAKTHROUGH</text>

  <text x="48" y="266" font-family="Georgia, serif" font-size="12" fill="#334155">
    Bigtable is a distributed storage system for managing structured data that 
  </text>
  <text x="48" y="286" font-family="Georgia, serif" font-size="12" fill="#334155">
    scales across thousands of servers with SSTables and Chubby locks.
  </text>
  <text x="48" y="306" font-family="Georgia, serif" font-size="12" fill="#334155">
    ...
  </text>

  <!-- Formula Badge -->
  <rect x="380" y="232" width="176" height="36" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="468" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#64748b">MULTIDIMENSIONAL MAP</text>
  <text x="468" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" font-style="italic" fill="#0f172a">(row, col, time) -&gt; string</text>

  <!-- Footer -->
  <text x="32" y="370" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Algoryn Verified System Design Archive • OSDI &apos;06</text>
  <text x="568" y="370" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#64748b">Verified Peer-Reviewed</text>
</svg>